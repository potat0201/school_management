<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Management</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="container">
    <h1>School Management Dashboard</h1>
    <p>Luồng dữ liệu: MongoDB -> Spring Boot Backend -> Frontend (localhost:8080)</p>

    <section>
        <h2>Tổng quan collection</h2>
        <div id="overview" class="cards"></div>
    </section>

    <section>
        <h2>Thêm sinh viên</h2>
        <form id="studentForm">
            <input type="text" id="studentCode" placeholder="Mã sinh viên" required />
            <input type="text" id="studentName" placeholder="Họ tên" required />
            <input type="email" id="studentEmail" placeholder="Email" required />
            <input type="text" id="studentPhone" placeholder="Số điện thoại" />
            <button type="submit">Thêm</button>
        </form>
        <p id="message"></p>
    </section>

    <section>
        <h2>Danh sách sinh viên</h2>
        <table>
            <thead>
            <tr>
                <th>Mã SV</th>
                <th>Họ tên</th>
                <th>Email</th>
                <th>Số điện thoại</th>
            </tr>
            </thead>
            <tbody id="studentBody"></tbody>
        </table>
    </section>

    <section>
        <h2>Danh sách lớp học</h2>
        <table>
            <thead>
            <tr>
                <th>Mã lớp</th>
                <th>Subject ID</th>
                <th>Teacher ID</th>
                <th>Semester ID</th>
            </tr>
            </thead>
            <tbody id="classBody"></tbody>
        </table>
    </section>
</div>
<script src="/app.js"></script>
</body>
</html>
